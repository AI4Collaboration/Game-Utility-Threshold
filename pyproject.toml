[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gut", "gut.*"]

[project]
name = "game-utility-threshold"
version = "0.6.0"
description = "The symmetric one-shot games and saved experiment in the LessWrong post."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Inspect 0.3.263 imports acp.helpers, removed in agent-client-protocol 1.0.
# Inspect leaves provider SDKs optional; OpenRouter uses the tested OpenAI SDK.
inspect = ["inspect-ai==0.3.263", "agent-client-protocol==0.12.1", "openai==3.13.0"]
figures = ["matplotlib>=3.8,<4"]
validation = ["matplotlib>=3.8,<4", "pandas>=2.2,<3", "seaborn>=0.13,<0.14", "scikit-learn>=1.5,<2"]
