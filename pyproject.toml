[project]
name = "utility-threshold-games"
version = "0.5.0"
description = "Research-grade utility-threshold games with formal and AISI Inspect observability."
requires-python = ">=3.11"
dependencies = ["inspect-ai>=0.3.259", "openai>=1", "python-dotenv>=1"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
