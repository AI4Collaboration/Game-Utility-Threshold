# Copy this file to .github/workflows/research-validation.yml to activate it.
# It is kept as a template because the repository's current OAuth push token
# does not have GitHub's workflow scope.
name: Research validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and artifact audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - name: Reproduce committed Phase 1 analysis
        run: |
          python analyze_phase_one_results.py \
            results/phase_one_model_eval.json \
            --output /tmp/phase_one_analysis.json
          cmp results/phase_one_analysis.json /tmp/phase_one_analysis.json

  lean:
    name: Lean proofs and Python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1.5.0
        with:
          lake-package-directory: lean
          build: true
          test: false
          axiom-audit: true
          axiom-audit-root: UtilityThreshold
      - working-directory: lean
        run: lake exe parity_check
      - run: python3 -m unittest tests.test_lean_parity
