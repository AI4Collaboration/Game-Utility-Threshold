  <g id="text_28">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18232b" x="44.64" y="42.956719" transform="rotate(-0 44.64 42.956719)">Objective effects differ across the four games</text>
  </g>
  <g id="text_29">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586174" x="44.64" y="62.1" transform="rotate(-0 44.64 62.1)">Open-ended → explicit individual expected utility | same games, models and treatments</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #374151" transform="translate(44.64 489.365625)">Bold numbers are explicit-utility scores; signed labels are percentage-point changes from open-ended. A green/red segment spans the two conditions; bars are not</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #374151" transform="translate(44.64 502.842969)">additive metrics. 96 joint games per game per condition, pooled over all model pairs and treatments. Descriptive rates; one observation per factorial cell. No</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #374151" transform="translate(44.64 516.320312)">confidence intervals or significance claims.</text>
  </g>
  <g id="text_31">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #637083" x="1071.36" y="12.178828" transform="rotate(-0 1071.36 12.178828)">AISI RESEARCH  /  REPLICATION 02  /  11 SEP 2026</text>
  </g>
