    <dc:description>Under a deterministic step-policy assumption, observed COOPERATE requires θ ≥ v and ATTACK requires θ &lt; v. Intervals use all valid sampled actions at that defense, not just the adjacent triplet. Contradictions are shown explicitly. Yellow indicates censoring or invalid outputs. These descriptive brackets are not statistical confidence intervals or fitted model traits.</dc:description>
