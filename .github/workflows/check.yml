name: Check games, proofs, and publish Pages
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'matplotlib>=3.8,<4' 'pandas>=2.2,<3' 'seaborn>=0.13,<0.14' 'scikit-learn>=1.5,<2'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check_oversight_ui.cjs
      - run: node tests/check_browser_engine.cjs
      - run: node tests/check_science.cjs
      - run: python reproduce.py
      - run: python experiment.py plan runs/ci --repetitions 2
      - run: python experiment.py run runs/ci
      - run: python experiment.py report runs/ci --plot
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          use-mathlib-cache: "false"
      - run: python experiment.py proofs runs/ci --check
      - run: python tests/check_lean.py
  build-pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'matplotlib>=3.8,<4'
      - uses: actions/configure-pages@v5
      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
