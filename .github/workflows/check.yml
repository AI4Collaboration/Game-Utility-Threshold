name: Check games and proofs
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check_oversight_ui.cjs
      - run: python -m pip install 'matplotlib>=3.8,<4'
      - run: python reproduce.py
      - run: python experiment.py plan runs/ci --repetitions 2
      - run: python experiment.py run runs/ci
      - run: python experiment.py report runs/ci --plot
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: "true"
          test: "false"
          use-mathlib-cache: "false"
      - run: python experiment.py proofs runs/ci --check
      - run: python tests/check_lean.py
